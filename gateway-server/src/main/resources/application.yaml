eureka:
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true
server:
  port: 9999
spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8888 # Eureka
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: qwer

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          # config time out
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          routes:
            - id: pipeline-service
              uri: lb://pipeline-service
              predicates:
                - Path=/pipeline-service/**
              filters:
                - RewritePath=/pipeline-service/(?<segment>.*), /${segment}
                # redis rate limiter pattern
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                # Retry config pattern
                #                - name: Retry
                #                  args:
                #                    retries: 3
                #                    statuses: BAD_GATEWAY
                #                    methods: GET
                #                    backoff:
                #                      firstBackoff: 10ms
                #                      maxBackoff: 50ms
                #                      factor: 2
                #                      basedOnPreviousValue: false
                # CircuitBreaker config pattern
            #                - name: CircuitBreaker
            #                  args:
            #                    name: pipeline-serviceCircuitBreaker
            #                    # hanlde fallback cache from redis
            #                    fallbackUri: forward:/fallback/pipeline-service/client/account/secured

            - id: account-service
              uri: lb://account
              predicates:
                - Path=/account-service/**
              filters:
                - RewritePath=/account-service/(?<segment>.*), /${segment}
                - name: CircuitBreaker
                  args:
                    name: account-serviceCircuitBreaker
                    fallbackUri: forward:/fallback/account
  #                    statusCodes:
  #                      - 404
  #                      - 500
  #                      - 503
  #                      - 504

  # Oauth2 Client
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090
      client:
        provider:
          itp-standard:
            # iam server
            issuer-uri: http://localhost:9090
        registration:
          itp-standard:
            provider: itp-standard
            client-id: itp-standard
            client-secret: qwerqwer
            redirect-uri: http://localhost:9999/login/oauth2/code/itp-standard
            authorization-grant-type:
              - authorization_code
            scope:
              - openid # Auto issue access token
              - profile # Get profile
              - email # Get email

# Resilience4J
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10 # count requests, timebase duration
        failure-rate-threshold: 50 # Percentages
        permitted-number-of-calls-in-half-open-state: 2 #
        wait-duration-in-open-state: 10000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"


